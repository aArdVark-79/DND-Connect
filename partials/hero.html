<header class="hero">
  <div class="wrap">
    <p class="eyebrow">A notice board for tabletop games</p>
    <h1 class="title">The Quest Board</h1>
    <p class="subtitle">Where Game Masters post their tables, and players go looking for a seat.</p>
  </div>
  <button type="button" class="d20-btn" id="d20Btn" title="Roll a d20">
    <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <polygon points="50,4 92,28 92,72 50,96 8,72 8,28" stroke="#2a241a" stroke-width="2.5" fill="#f1e8d0"/>
      <polygon points="50,4 92,28 50,50" fill="#c99a3f" opacity="0.5"/>
      <polygon points="50,4 8,28 50,50" fill="#6b2737" opacity="0.35"/>
      <polygon points="8,28 8,72 50,50" fill="#2c4a3b" opacity="0.4"/>
      <polygon points="92,28 92,72 50,50" fill="#a3782f" opacity="0.4"/>
      <polygon points="50,96 8,72 50,50" fill="#3d6650" opacity="0.4"/>
      <polygon points="50,96 92,72 50,50" fill="#82303f" opacity="0.35"/>
      <text id="d20FaceText" x="50" y="56" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="15" fill="#2a241a">20</text>
    </svg>
  </button>
  <p class="d20-result" id="d20Result"><span class="roll-num" id="d20RollNum"></span><span id="d20RollLabel"></span></p>
</header>
