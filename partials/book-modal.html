<!-- The book: post a listing / my submissions / interests, all in one open book -->
<div class="book-modal-overlay" id="bookOverlay">
  <div class="book-frame">
    <button type="button" class="book-close" id="closeBook">×</button>
    <div class="book-outer">
      <p class="book-label" id="bookLabel">✦ The Quest Board ✦</p>
      <div class="book" id="book">
        <div class="page page-left" id="pageLeft"></div>
        <div class="spine-shadow"></div>
        <div class="page page-right" id="pageRight"></div>
        <div class="page-interstitial" id="pageInterstitial"><div class="interstitial-inner" id="interstitialInner"></div></div>
      </div>
    </div>
    <div class="bookmarks" id="bookmarks">
      <button type="button" class="bookmark" data-tab="post">Post a listing</button>
      <button type="button" class="bookmark" data-tab="submissions">My submissions</button>
      <button type="button" class="bookmark" data-tab="interests">Interests</button>
      <button type="button" class="bookmark" data-tab="allies">Allies</button>
    </div>
  </div>
</div>
