<div class="board">
  <div class="wrap">
    <div class="filters-row">
      <div class="role-toggle" id="roleToggle">
        <button data-role="all" class="active">All</button>
        <button data-role="dm">GMs</button>
        <button data-role="player">Players</button>
      </div>
      <button class="filter-toggle-btn" id="filterToggleBtn">Filters ▾</button>
      <div class="actions-row">
        <button class="add-btn" id="openPostFlow">+ Post your listing</button>
        <button class="add-btn secondary" id="openMyListings">My submissions</button>
      </div>
    </div>
    <div class="filters-panel" id="filtersPanel">
      <select id="systemFilter">
        <option value="">Any system</option>
        <option value="D&D 5e">D&D 5e</option>
        <option value="Pathfinder 2e">Pathfinder 2e</option>
        <option value="Call of Cthulhu">Call of Cthulhu</option>
        <option value="Blades in the Dark">Blades in the Dark</option>
        <option value="Other">Other</option>
      </select>
      <select id="formatFilter">
        <option value="">Any format</option>
        <option value="Online">Online</option>
        <option value="In-person">In-person</option>
      </select>
      <select id="expFilter">
        <option value="">Any experience</option>
        <option value="New">New</option>
        <option value="Some experience">Some experience</option>
        <option value="Veteran">Veteran</option>
      </select>
      <select id="sortOrder">
        <option value="recent">Most recent</option>
        <option value="alpha">Alphabetical (A–Z)</option>
      </select>
    </div>
  </div>
</div>
